[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netauto"
version = "1.0.0"
description = "Automated Data Center Network Lab with Containerlab, FRRouting, OSPF, eBGP, and ECMP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Senior Network & Automation Engineer" }
]
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "click>=8.0",
    "pytest>=8.0",
]

[project.scripts]
netauto = "netauto.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: integration tests requiring active Containerlab/Docker network",
]
